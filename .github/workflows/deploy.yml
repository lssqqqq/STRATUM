name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Путь сайта (base):
      #  - репозиторий "<логин>.github.io"  -> "/"
      #  - любой другой репозиторий         -> "/<имя-репо>/"
      #  - свой домен: создайте переменную репозитория VITE_BASE со значением "/"
      #    (Settings -> Secrets and variables -> Actions -> Variables)
      - name: Compute base path
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ -n "${{ vars.VITE_BASE }}" ]; then
            BASE="${{ vars.VITE_BASE }}"
          elif [[ "$REPO" == *.github.io ]]; then
            BASE="/"
          else
            BASE="/$REPO/"
          fi
          echo "VITE_BASE=$BASE" >> "$GITHUB_ENV"
          echo "Using base: $BASE"

      # `npm run build` сам запускает `npm run maps` (prebuild)
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
