<svg xmlns="http://www.w3.org/2000/svg" width="366" height="713" viewBox="0 0 366 713">
  <defs>
    <filter id="shadow" x="-10%" y="-5%" width="125%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- App Header background -->
  <rect width="366" height="713" fill="#edf2fa"/>

  <!-- Top bar area -->
  <g transform="translate(8, 8)">
    <!-- Google Docs Document Icon (Blue sheet with folded corner) -->
    <path d="M2 0 L16 0 L22 6 L22 24 C22 25.1 21.1 26 20 26 L2 26 C0.9 26 0 25.1 0 24 L0 2 C0 0.9 0.9 0 2 0 Z" fill="#2684fc"/>
    <path d="M16 0 L22 6 L16 6 Z" fill="#a8c7fa"/>
    <rect x="4" y="9" width="14" height="2" rx="1" fill="#ffffff"/>
    <rect x="4" y="13" width="14" height="2" rx="1" fill="#ffffff"/>
    <rect x="4" y="17" width="9" height="2" rx="1" fill="#ffffff"/>

    <!-- Document Title -->
    <text x="30" y="18" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#1f1f1f">My STRATEGY</text>

    <!-- .DOCX Badge -->
    <rect x="152" y="5" width="46" height="18" rx="3" fill="#0b57d0"/>
    <text x="157" y="18" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">.DOCX</text>

    <!-- Header Actions Icons (Star, Move, Cloud) -->
    <!-- Star -->
    <path d="M214 16 L218 8 L222 16 L230 17 L224 23 L226 31 L218 26 L210 31 L212 23 L206 17 Z" transform="scale(0.55) translate(168, -4)" fill="none" stroke="#444746" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Move folder icon -->
    <path d="M234 8 L240 8 L242 10 L250 10 C251 10 252 11 252 12 L252 21 C252 22 251 23 250 23 L234 23 C233 23 232 22 232 21 L232 10 C232 9 233 8 234 8 Z" fill="none" stroke="#444746" stroke-width="1.4"/>
    <path d="M238 16 L246 16 M243 13 L246 16 L243 19" fill="none" stroke="#444746" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Cloud with check -->
    <path d="M265 18 C263.5 18 262 17 262 15 C262 13 263.5 11.5 265.5 11.5 C266 9.5 268 8 270.5 8 C273.5 8 275.5 10 275.5 12.5 C277 13 278 14.5 278 16 C278 17.5 276.5 18 275 18 Z" fill="none" stroke="#444746" stroke-width="1.4"/>
  </g>

  <!-- Left Sidebar icons (Search & Outline) -->
  <g transform="translate(14, 85)">
    <circle cx="14" cy="14" r="8" fill="none" stroke="#444746" stroke-width="1.8"/>
    <line x1="20" y1="20" x2="26" y2="26" stroke="#444746" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g transform="translate(14, 185)">
    <circle cx="14" cy="14" r="13" fill="#d3e3fd"/>
    <line x1="9" y1="10" x2="19" y2="10" stroke="#041e49" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="9" y1="14" x2="19" y2="14" stroke="#041e49" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="9" y1="18" x2="19" y2="18" stroke="#041e49" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Menu Bar -->
  <g transform="translate(34, 40)">
    <!-- Active 'File' item -->
    <rect x="0" y="0" width="36" height="24" rx="4" fill="#e8eaed"/>
    <text x="8" y="16" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#1f1f1f">File</text>

    <!-- Other Menu Items -->
    <text x="44" y="16" font-family="Arial, sans-serif" font-size="13" fill="#444746">Edit</text>
    <text x="84" y="16" font-family="Arial, sans-serif" font-size="13" fill="#444746">View</text>
    <text x="126" y="16" font-family="Arial, sans-serif" font-size="13" fill="#444746">Insert</text>
    <text x="176" y="16" font-family="Arial, sans-serif" font-size="13" fill="#444746">Format</text>
    <text x="234" y="16" font-family="Arial, sans-serif" font-size="13" fill="#444746">Tools</text>
    <text x="280" y="16" font-family="Arial, sans-serif" font-size="13" fill="#444746">Help</text>
  </g>

  <!-- Open File Dropdown Menu -->
  <g transform="translate(34, 66)" filter="url(#shadow)">
    <!-- Menu Container -->
    <rect width="312" height="636" rx="8" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>

    <!-- Row 1: Create -->
    <g transform="translate(14, 26)">
      <rect x="0" y="-12" width="14" height="15" rx="1.5" fill="none" stroke="#444746" stroke-width="1.5"/>
      <line x1="4" y1="-5" x2="10" y2="-5" stroke="#444746" stroke-width="1.5"/>
      <text x="24" y="0" font-family="Arial, sans-serif" font-size="13" fill="#1f1f1f">Create</text>
      <path d="M278 -4 L283 0 L278 4" fill="#444746"/>
    </g>

    <!-- Row 2: Open (Ctrl+O) -->
    <g transform="translate(14, 58)">
      <path d="M0 -11 L5 -11 L7 -9 L13 -9 C14 -9 14.5 -8.5 14.5 -8 L14.5 -2 C14.5 -1.5 14 -1 13 -1 L1 -1 C0.5 -1 0 -1.5 0 -2 Z" fill="none" stroke="#444746" stroke-width="1.4"/>
      <text x="24" y="0" font-family="Arial, sans-serif" font-size="13" fill="#1f1f1f">Open</text>
      <text x="246" y="-1" font-family="Arial, sans-serif" font-size="11" fill="#747775">Ctrl+O</text>
    </g>

    <!-- Row 3: Create a copy -->
    <g transform="translate(14, 90)">
      <rect x="3" y="-12" width="12" height="14" rx="1" fill="none" stroke="#444746" stroke-width="1.4"/>
      <path d="M0 -8 L0 4 L11 4" fill="none" stroke="#444746" stroke-width="1.4"/>
      <text x="24" y="0" font-family="Arial, sans-serif" font-size="13" fill="#1f1f1f">Create a copy</text>
    </g>

    <!-- Row 4: Save as Google document -->
    <g transform="translate(14, 122)">
      <rect x="1" y="-12" width="13" height="14" rx="1" fill="none" stroke="#444746" stroke-width="1.4"/>
      <path d="M7 -9 L7 0 M4 -3 L7 0 L10 -3" fill="none" stroke="#444746" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="0" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#1f1f1f">Save as Google document</text>
    </g>

    <!-- Divider 1 -->
    <line x1="0" y1="142" x2="312" y2="142" stroke="#e1e3e1" stroke-width="1"/>

    <!-- Row 5: Share -->
    <g transform="translate(14, 168)">
      <circle cx="5" cy="-8" r="3.5" fill="none" stroke="#444746" stroke-width="1.4"/>
      <path d="M0 1 C0 -2 2 -3.5 5 -3.5 C8 -3.5 10 -2 10 1" fill="none" stroke="#444746" stroke-width="1.4"/>
      <line x1="12" y1="-5" x2="16" y2="-5" stroke="#444746" stroke-width="1.4"/>
      <line x1="14" y1="-7" x2="14" y2="-3" stroke="#444746" stroke-width="1.4"/>
      <text x="24" y="0" font-family="Arial, sans-serif" font-size="13" fill="#1f1f1f">Share</text>
      <path d="M278 -4 L283 0 L278 4" fill="#444746"/>
    </g>

    <!-- Row 6: Email -->
    <g transform="translate(14, 200)">
      <rect x="0" y="-10" width="15" height="11" rx="1" fill="none" stroke="#444746" stroke-width="1.4"/>
      <path d="M0 -9 L7.5 -4 L15 -9" fill="none" stroke="#444746" stroke-width="1.4" stroke-linejoin="round"/>
      <text x="24" y="0" font-family="Arial, sans-serif" font-size="13" fill="#1f1f1f">Email</text>
      <path d="M278 -4 L283 0 L278 4" fill="#444746"/>
    </g>

    <!-- Row 7: Download -->
    <g transform="translate(14, 232)">
      <path d="M7.5 -11 L7.5 0 M4 -3.5 L7.5 0 L11 -3.5" fill="none" stroke="#444746" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="1" y1="2" x2="14" y2="2" stroke="#444746" stroke-width="1.4" stroke-linecap="round"/>
      <text x="24" y="0" font-family="Arial, sans-serif" font-size="13" fill="#1f1f1f">Download</text>
      <path d="M278 -4 L283 0 L278 4" fill="#444746"/>
    </g>

    <!-- Row 8: Record video -->
    <g transform="translate(14, 264)">
      <circle cx="7.5" cy="-4.5" r="6.5" fill="none" stroke="#444746" stroke-width="1.4"/>
      <circle cx="7.5" cy="-4.5" r="2.5" fill="#444746"/>
      <text x="24" y="0" font-family="Arial, sans-serif" font-size="13" fill="#1f1f1f">Record video</text>
      <rect x="252" y="-11" width="32" height="16" rx="8" fill="#0b57d0"/>
      <text x="259" y="1" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff">New</text>
    </g>

    <!-- Divider 2 -->
    <line x1="0" y1="284" x2="312" y2="284" stroke="#e1e3e1" stroke-width="1"/>

    <!-- Row 9: Rename -->
    <g transform="translate(14, 310)">
      <path d="M1 -1 L4 0 L11 -8 L8 -11 L1 -3 Z" fill="none" stroke="#444746" stroke-width="1.4" stroke-linejoin="round"/>
      <line x1="0" y1="2" x2="13" y2="2" stroke="#444746" stroke-width="1.2"/>
      <text x="24" y="0" font-family="Arial, sans-serif" font-size="13" fill="#1f1f1f">Rename</text>
    </g>

    <!-- Row 10: Move -->
    <g transform="translate(14, 342)">
      <path d="M0 -11 L5 -11 L7 -9 L13 -9 C14 -9 14.5 -8.5 14.5 -8 L14.5 -2 C14.5 -1.5 14 -1 13 -1 L1 -1 C0.5 -1 0 -1.5 0 -2 Z" fill="none" stroke="#444746" stroke-width="1.4"/>
      <path d="M4 -5 L9 -5 M7 -7 L9 -5 L7 -3" fill="none" stroke="#444746" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="0" font-family="Arial, sans-serif" font-size="13" fill="#1f1f1f">Move</text>
    </g>

    <!-- Row 11: Add shortcut to -->
    <g transform="translate(14, 374)">
      <path d="M0 -11 L5 -11 L7 -9 L13 -9 C14 -9 14.5 -8.5 14.5 -8 L14.5 -2 C14.5 -1.5 14 -1 13 -1 L1 -1 C0.5 -1 0 -1.5 0 -2 Z" fill="none" stroke="#444746" stroke-width="1.4"/>
      <path d="M4 -3 L7 -7 L10 -7 L10 -4" fill="none" stroke="#444746" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="0" font-family="Arial, sans-serif" font-size="13" fill="#1f1f1f">Add shortcut to</text>
    </g>

    <!-- Row 12: Remove -->
    <g transform="translate(14, 406)">
      <path d="M1 -9 L13 -9 M3 -9 L3 2 C3 2.5 3.5 3 4 3 L10 3 C10.5 3 11 2.5 11 2 L11 -9 M5 -9 L5 -11 L9 -11 L9 -9" fill="none" stroke="#444746" stroke-width="1.4"/>
      <text x="24" y="0" font-family="Arial, sans-serif" font-size="13" fill="#1f1f1f">Remove</text>
    </g>

    <!-- Divider 3 -->
    <line x1="0" y1="426" x2="312" y2="426" stroke="#e1e3e1" stroke-width="1"/>

    <!-- Row 13: Version history -->
    <g transform="translate(14, 452)">
      <circle cx="7.5" cy="-4.5" r="6.5" fill="none" stroke="#444746" stroke-width="1.4"/>
      <path d="M7.5 -7.5 L7.5 -4.5 L9.5 -3" fill="none" stroke="#444746" stroke-width="1.4" stroke-linecap="round"/>
      <text x="24" y="0" font-family="Arial, sans-serif" font-size="13" fill="#1f1f1f">Version history</text>
      <path d="M278 -4 L283 0 L278 4" fill="#444746"/>
    </g>

    <!-- Divider 4 -->
    <line x1="0" y1="472" x2="312" y2="472" stroke="#e1e3e1" stroke-width="1"/>

    <!-- Row 14: Information -->
    <g transform="translate(14, 498)">
      <circle cx="7.5" cy="-4.5" r="6.5" fill="none" stroke="#444746" stroke-width="1.4"/>
      <circle cx="7.5" cy="-7.5" r="0.8" fill="#444746"/>
      <line x1="7.5" y1="-5.5" x2="7.5" y2="-2" stroke="#444746" stroke-width="1.4" stroke-linecap="round"/>
      <text x="24" y="0" font-family="Arial, sans-serif" font-size="13" fill="#1f1f1f">Information</text>
    </g>

    <!-- Row 15: Security-related restrictions -->
    <g transform="translate(14, 530)">
      <path d="M7.5 -12 L1 -9 L1 -4 C1 0 7.5 3.5 7.5 3.5 C7.5 3.5 14 0 14 -4 L14 -9 Z" fill="none" stroke="#444746" stroke-width="1.4"/>
      <circle cx="7.5" cy="-4.5" r="2" fill="none" stroke="#444746" stroke-width="1.2"/>
      <text x="24" y="0" font-family="Arial, sans-serif" font-size="13" fill="#1f1f1f">Security-related restrictions</text>
    </g>

    <!-- Row 16: Language -->
    <g transform="translate(14, 562)">
      <circle cx="7.5" cy="-4.5" r="6.5" fill="none" stroke="#444746" stroke-width="1.4"/>
      <ellipse cx="7.5" cy="-4.5" rx="3" ry="6.5" fill="none" stroke="#444746" stroke-width="1.2"/>
      <line x1="1" y1="-4.5" x2="14" y2="-4.5" stroke="#444746" stroke-width="1.2"/>
      <text x="24" y="0" font-family="Arial, sans-serif" font-size="13" fill="#1f1f1f">Language</text>
      <path d="M278 -4 L283 0 L278 4" fill="#444746"/>
    </g>

    <!-- Row 17: Page Settings -->
    <g transform="translate(14, 594)">
      <rect x="1" y="-11" width="11" height="14" rx="1" fill="none" stroke="#444746" stroke-width="1.4"/>
      <circle cx="11" cy="0" r="3" fill="none" stroke="#444746" stroke-width="1.4"/>
      <text x="24" y="0" font-family="Arial, sans-serif" font-size="13" fill="#1f1f1f">Page Settings</text>
    </g>

    <!-- Row 18: Print (Ctrl+P) -->
    <g transform="translate(14, 626)">
      <path d="M2 -7 L12 -7 L12 -2 L2 -2 Z M1 -2 L13 -2 C13.5 -2 14 -1.5 14 -1 L14 3 C14 3.5 13.5 4 13 4 L1 4 C0.5 4 0 3.5 0 3 L0 -1 C0 -1.5 0.5 -2 1 -2 Z M2 2 L12 2 L12 5 L2 5 Z" fill="none" stroke="#444746" stroke-width="1.2"/>
      <text x="24" y="0" font-family="Arial, sans-serif" font-size="13" fill="#1f1f1f">Print</text>
      <text x="246" y="-1" font-family="Arial, sans-serif" font-size="11" fill="#747775">Ctrl+P</text>
    </g>
  </g>
</svg>